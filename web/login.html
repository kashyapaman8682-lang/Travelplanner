<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelPlanner - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 data-lang-key="brand">TravelPlanner</h1>
  <nav>
    <a href="index.html" data-lang-key="home">Home</a>
    <a href="hotels.html" data-lang-key="hotels">Hotels</a>
    <a href="services.html" data-lang-key="services">Plans & Services</a>
    <a href="login.html" data-lang-key="login">Login</a>
    <a href="#contact" data-lang-key="contact">Contact</a>
  </nav>
  <select id="language" class="lang-select">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="es">Spanish</option>
  </select>
</header>

<section class="login-form">
  <h2 data-lang-key="login_title">Login</h2>
  <form id="loginForm">
    <label data-lang-key="username">Username:</label>
    <input type="text" id="username" required>
    <label data-lang-key="password">Password:</label>
    <input type="password" id="password" required>
    <button type="submit" data-lang-key="login_btn">Login</button>
  </form>
</section>

<footer>
  <p>&copy; 2025 TravelPlanner. All rights reserved.</p>
</footer>

<script>
const loginForm = document.getElementById('loginForm');
loginForm.addEventListener('submit', function(e){
  e.preventDefault();
  alert("Login successful!");
  loginForm.reset();
});
</script>
<script src="lang.js"></script>
</body>
</html>
