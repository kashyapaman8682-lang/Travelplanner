<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmation - TravelPlanner</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 data-lang-key="brand">TravelPlanner</h1>
  <nav>
    <a href="index.html" data-lang-key="home">Home</a>
    <a href="hotels.html" data-lang-key="hotels">Hotels</a>
    <a href="services.html" data-lang-key="services">Plans & Services</a>
    <a href="login.html" data-lang-key="login">Login</a>
    <a href="#contact" data-lang-key="contact">Contact</a>
  </nav>
  <select id="language" class="lang-select">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="es">Spanish</option>
  </select>
</header>

<section class="confirmation">
  <h2 data-lang-key="booking_confirmed">Booking Confirmation</h2>
  <div class="confirmation-box">
    <p id="bookingDetails"></p>
    <a href="index.html"><button data-lang-key="back_home">Back to Home</button></a>
  </div>
</section>

<footer>
  <p>&copy; 2025 TravelPlanner. All rights reserved.</p>
</footer>

<script>
  const hotel = sessionStorage.getItem('hotel');
  const checkin = sessionStorage.getItem('checkin');
  const checkout = sessionStorage.getItem('checkout');
  const guests = sessionStorage.getItem('guests');
  document.getElementById('bookingDetails').innerHTML = `
    <strong data-lang-key="hotel">Hotel:</strong> ${hotel} <br>
    <strong data-lang-key="checkin">Check-in:</strong> ${checkin} <br>
    <strong data-lang-key="checkout">Check-out:</strong> ${checkout} <br>
    <strong data-lang-key="guests">Guests:</strong> ${guests}
  `;
</script>
<script src="lang.js"></script>
</body>
</html>
